name: CI/CD ORM

# develop  -> every push is tested (fast feedback while working).
# PR to stage -> tested before it can be merged.
# stage    -> tested again on the merged result; if green it is merged into main,
#             the package version is bumped and a release is cut. Nothing else touches main.

on:
  push:
    branches: [develop, stage]
  pull_request:
    branches: [stage]
  workflow_dispatch:

# A newer push to develop / a PR supersedes the run before it, but a promotion that is
# already running on stage is never cancelled half-way.
concurrency:
  group: orm-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stage' }}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ TESTS ----
  test:
    name: Tests (Python + PostGIS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: soil_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soil_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      # A new developer (or a new environment) starts from an empty database: the whole
      # migration chain has to run on one.
      - name: Migrations apply on an empty database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrations_check
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE migrations_check"
          psql -h localhost -U postgres -d migrations_check -c "CREATE EXTENSION IF NOT EXISTS postgis"
          python -c "from mflsoildata_orm.migrations import upgrade, current; upgrade(); current()"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soil_platform
        run: pytest tests/

  # ---------------------------------------------------------------- PROMOTE ----
  promote:
    name: Merge stage into main
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: orm-promote
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # If main is protected, use a token that may push to it (see README).
          token: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Merge the tested commit into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          # The exact commit that passed the tests, not whatever stage points to by now.
          git merge --no-ff "$GITHUB_SHA" -m "Promote stage to main (${GITHUB_SHA::7})"
          git push origin main

  # ---------------------------------------------------------------- RELEASE ----
  release:
    name: Bump version and create release
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Next version
        id: version
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next="v0.1.0"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      # The API installs this package straight from a tag, so the tagged commit has to carry
      # the version it is tagged with.
      - name: Write the version into pyproject.toml
        run: |
          version="${{ steps.version.outputs.tag }}"
          sed -i -E "s/^version = \".*\"/version = \"${version#v}\"/" pyproject.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Release ${{ steps.version.outputs.tag }}" || echo "version already up to date"
          git push origin main

      - name: Package
        run: zip -r releaseORM.zip src

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" releaseORM.zip \
            --target "$(git rev-parse HEAD)" \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --generate-notes
